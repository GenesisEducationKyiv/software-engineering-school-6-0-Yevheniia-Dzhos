<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Release Notifier</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(109, 94, 252, .35), transparent 28%),
        radial-gradient(circle at bottom right, rgba(48, 208, 255, .18), transparent 24%),
        linear-gradient(135deg, #070b16, #0f1730 40%, #0c1120);
      color: #eef2ff;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: rgba(15, 23, 48, 0.82);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .4);
      padding: 32px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 40px;
      line-height: 1.05;
    }

    p {
      color: #b8c3e2;
      line-height: 1.6;
    }

    .row {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 30px;
      }
    }

    input,
    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 16px;
    }

    input {
      background: rgba(255, 255, 255, .06);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .08);
    }

    button {
      margin-top: 14px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #6d5efc, #32d0ff);
      box-shadow: 0 15px 35px rgba(80, 124, 255, 0.35);
      font-weight: 700;
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      display: none;
      background: rgba(255, 255, 255, .06);
      color: #fff;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .links a {
      color: #9dc8ff;
      text-decoration: none;
    }

    .badge {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
      color: #dfe7ff;
      margin-bottom: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="badge">Minimal monolith • Express • PostgreSQL • Docker</div>
    <h1>GitHub Release Notifier</h1>
    <p>Subscribe to email notifications about new GitHub releases. Clean UI, same API, one monolith.</p>
    <form id="form">
      <div class="row">
        <input id="email" type="email" placeholder="you@example.com" required />
        <input id="repo" type="text" placeholder="owner/repo" required />
      </div>
      <button type="submit">Subscribe</button>
    </form>
    <div class="status" id="status"></div>
    <div class="links">
      <a href="/docs">Swagger docs</a>
      <a href="/health">Health</a>
    </div>
  </div>
  <script>
    const form = document.getElementById('form');
    const statusBox = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusBox.style.display = 'block';
      statusBox.textContent = 'Submitting...';
      const payload = {
        email: document.getElementById('email').value,
        repo: document.getElementById('repo').value
      };
      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        statusBox.textContent = response.ok ? data.message : data.error;
      } catch {
        statusBox.textContent = 'Request failed';
      }
    });
  </script>
</body>

</html>
