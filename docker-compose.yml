services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      notification-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      logstash:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/releases}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      NOTIFICATION_EXCHANGE: ${NOTIFICATION_EXCHANGE:-notifications}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notifications}
      NOTIFICATION_RETRY_EXCHANGE: ${NOTIFICATION_RETRY_EXCHANGE:-notifications.retry}
      NOTIFICATION_RETRY_QUEUE: ${NOTIFICATION_RETRY_QUEUE:-notifications.retry}
      NOTIFICATION_DLQ_EXCHANGE: ${NOTIFICATION_DLQ_EXCHANGE:-notifications.dead-letter}
      NOTIFICATION_DLQ: ${NOTIFICATION_DLQ:-notifications.dead-letter}
      NOTIFICATION_RETRY_TTL_MS: ${NOTIFICATION_RETRY_TTL_MS:-5000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      BROKER_RECONNECT_DELAY_MS: ${BROKER_RECONNECT_DELAY_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_REQUEST_TIMEOUT_MS: ${GITHUB_REQUEST_TIMEOUT_MS:-10000}
      SCAN_INTERVAL_MS: ${SCAN_INTERVAL_MS:-300000}
      SCAN_CHUNK_SIZE: ${SCAN_CHUNK_SIZE:-5}
    logging:
      driver: gelf
      options:
        gelf-address: "udp://host.docker.internal:12201"
        tag: "github-release-notifier"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/releases}
    command: ["node", "src/db/runMigrations.js"]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      mailhog:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/releases}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      NOTIFICATION_EXCHANGE: ${NOTIFICATION_EXCHANGE:-notifications}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notifications}
      NOTIFICATION_RETRY_EXCHANGE: ${NOTIFICATION_RETRY_EXCHANGE:-notifications.retry}
      NOTIFICATION_RETRY_QUEUE: ${NOTIFICATION_RETRY_QUEUE:-notifications.retry}
      NOTIFICATION_DLQ_EXCHANGE: ${NOTIFICATION_DLQ_EXCHANGE:-notifications.dead-letter}
      NOTIFICATION_DLQ: ${NOTIFICATION_DLQ:-notifications.dead-letter}
      NOTIFICATION_RETRY_TTL_MS: ${NOTIFICATION_RETRY_TTL_MS:-5000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      BROKER_RECONNECT_DELAY_MS: ${BROKER_RECONNECT_DELAY_MS:-5000}
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-3002}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-GitHub Release Notifier <no-reply@example.com>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    logging:
      driver: gelf
      options:
        gelf-address: "udp://host.docker.internal:12201"
        tag: "notification-service"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: releases
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d releases"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    restart: unless-stopped
    ports:
      - "12201:12201/udp"
    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600 | grep -q '\"status\":\"green\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
