  <path class="flow-dashed gray" d="M640 517 L640 535 L1328 535 L1328 1105 L1350 1105"/>
  <path class="flow-dashed gray" d="M1830 755 L1830 985 L1710 985 L1710 1015"/>
  <text class="tiny" x="1345" y="922" fill="#64748b">metrics + logs</text>

