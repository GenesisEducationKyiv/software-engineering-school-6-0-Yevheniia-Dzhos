<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 24px; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; }
      .label { font-size: 17px; }
      .arrow { stroke: #111; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .line { stroke: #111; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <text x="8" y="40" class="title">System Design — GitHub Release Notifier</text>
  <text x="8" y="90" class="subtitle">High-Level Architecture</text>

  <rect x="8" y="245" width="215" height="185" rx="6" fill="#f5fff5" stroke="#7abf6a"/>
  <text x="84" y="280" class="box-title">User/Browser</text>
  <text x="38" y="330" class="body">• Subscribe</text>
  <text x="38" y="357" class="body">• Confirm Email</text>
  <text x="38" y="384" class="body">• Unsubscribe</text>
  <text x="38" y="411" class="body">• View Docs</text>

  <rect x="390" y="215" width="315" height="245" rx="8" fill="#eaf3ff" stroke="#6c9ee8"/>
  <text x="436" y="245" class="box-title">Express.js API (Monolith)</text>
  <text x="432" y="280" class="body">• POST /api/subscribe</text>
  <text x="432" y="307" class="body">• GET /api/confirm/:token</text>
  <text x="432" y="334" class="body">• GET /api/unsubscribe/:token</text>
  <text x="432" y="361" class="body">• GET /api/subscriptions</text>
  <text x="432" y="388" class="body">• GET /health</text>
  <text x="432" y="415" class="body">• GET /docs</text>

  <rect x="885" y="155" width="255" height="255" rx="10" fill="#f4e6fb" stroke="#a66bc2"/>
  <text x="965" y="195" class="box-title">PostgreSQL</text>
  <text x="932" y="240" class="body">• repositories</text>
  <text x="932" y="270" class="body">• subscriptions</text>
  <text x="932" y="300" class="body">• confirmation and</text>
  <text x="948" y="327" class="body">unsubscribe tokens</text>
  <text x="932" y="357" class="body">• last_seen_tag</text>
  <text x="932" y="387" class="body">• timestamps</text>

  <rect x="1245" y="215" width="255" height="130" rx="6" fill="#fff8e6" stroke="#d8a92f"/>
  <text x="1332" y="255" class="box-title">GitHub API</text>
  <text x="1286" y="303" class="body">• Validate repository</text>
  <text x="1286" y="330" class="body">• Get latest release</text>

  <rect x="390" y="535" width="315" height="215" rx="8" fill="#fff8e6" stroke="#d8a92f"/>
  <text x="492" y="575" class="box-title">Email Service</text>
  <text x="432" y="625" class="body">• Confirmation emails</text>
  <text x="432" y="653" class="body">• Release notifications</text>
  <text x="432" y="681" class="body">• Unsubscribe links</text>
  <text x="432" y="709" class="body">• MailHog / Nodemailer</text>

  <rect x="1160" y="510" width="440" height="245" rx="8" fill="#f5fff5" stroke="#7abf6a"/>
  <text x="1242" y="555" class="box-title">Background Scanner (Scheduler)</text>
  <text x="1208" y="613" class="body">• Runs every N minutes (SCAN_INTERVAL_MS)</text>
  <text x="1208" y="640" class="body">• Fetch latest releases from GitHub</text>
  <text x="1208" y="667" class="body">• Compare with last_seen_tag</text>
  <text x="1208" y="694" class="body">• Notify confirmed subscribers</text>
  <text x="1208" y="721" class="body">• Update last_seen_tag</text>

  <path d="M223 337 L390 337" class="arrow"/>
  <text x="270" y="323" class="label">HTTPS</text>

  <path d="M705 275 L885 275" class="arrow"/>
  <text x="768" y="263" class="label">SQL</text>

  <path d="M705 350 C850 350 1085 350 1245 285" class="arrow"/>
  <text x="735" y="343" class="label">HTTP (REST)</text>

  <path d="M548 460 L548 535" class="arrow"/>
  <text x="555" y="503" class="label">SMTP</text>

  <path d="M1245 280 L1140 280" class="line"/>
  <path d="M1140 280 L1245 280" class="arrow"/>

  <path d="M1375 510 L1375 345" class="arrow"/>
  <text x="1388" y="425" class="label">HTTP (REST)</text>

  <path d="M1160 635 L1012 635 L1012 410" class="arrow"/>
  <text x="930" y="626" class="label">SQL (Read/Write)</text>

  <path d="M1160 700 C980 700 860 660 705 642" class="arrow"/>
  <text x="820" y="690" class="label">SMTP notifications</text>
</svg>
