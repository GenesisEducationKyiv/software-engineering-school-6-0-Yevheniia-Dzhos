<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1280" viewBox="0 0 2000 1280" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Release Notifier - high-level application architecture</title>
  <desc id="desc">High-level architecture diagram for the main app, notification service, PostgreSQL, RabbitMQ, GitHub API, SMTP, and observability stack.</desc>

  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#15803d"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <style>
      .page { fill: #fbfcff; }
      .title { font: 800 30px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .subtitle { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .section-title { font: 800 16px "Segoe UI", Arial, sans-serif; letter-spacing: .4px; }
      .lane-label { font: 800 12px "Segoe UI", Arial, sans-serif; letter-spacing: 1.2px; fill: #8b7bd8; }
      .tiny { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .box-title { font: 800 15px "Segoe UI", Arial, sans-serif; fill: #1e293b; }
      .box-sub { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #94a3b8; }
      .box-text { font: 500 12.5px "Segoe UI", Arial, sans-serif; fill: #475569; }

      .module { fill: #fff; stroke: #7c3aed; stroke-width: 2.5; filter: url(#shadow); }
      .service { fill: #fff; stroke: #0891b2; stroke-width: 2.5; filter: url(#shadow); }
      .external { fill: #fff; stroke: #475569; stroke-width: 2.5; filter: url(#shadow); }
      .db { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; filter: url(#shadow); }
      .mq { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; filter: url(#shadow); }
      .obs { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 9 7; }

      .main-boundary { fill: #f6f3ff; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 11 8; }
      .service-boundary { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; stroke-dasharray: 11 8; }

      .badge-slate { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
      .badge-dark { fill: #1e293b; stroke: #1e293b; stroke-width: 2; }
      .badge-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .badge-orange { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .badge-gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }

      .flow { fill: none; stroke-width: 2.75; stroke-linecap: round; stroke-linejoin: round; }
      .flow-dashed { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 7; }
      .purple { stroke: #7c3aed; marker-end: url(#arrow-purple); }
      .green { stroke: #15803d; marker-end: url(#arrow-green); }
      .orange { stroke: #ea580c; marker-end: url(#arrow-orange); }
      .teal { stroke: #0891b2; marker-end: url(#arrow-teal); }
      .gray { stroke: #64748b; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="2000" height="1280"/>

  <text class="title" x="40" y="54">GitHub Release Notifier - high-level application architecture</text>
  <text class="subtitle" x="40" y="84">Main app + notification-service - PostgreSQL - RabbitMQ - gRPC - saga - observability</text>

  <rect class="external" x="40" y="145" width="330" height="110" rx="16"/>
  <rect class="badge-slate" x="56" y="161" width="46" height="46" rx="10"/>
  <use href="#icon-browser" x="63" y="168" width="32" height="32" color="#334155"/>
  <text class="box-title" x="114" y="185">Browser / API client</text>
  <text class="box-text" x="114" y="209">HTML pages, REST API</text>
  <text class="box-text" x="114" y="231">Swagger UI</text>

  <rect class="external" x="430" y="168" width="310" height="76" rx="14"/>
  <rect class="badge-slate" x="446" y="182" width="44" height="44" rx="10"/>
  <use href="#icon-gear" x="452" y="188" width="32" height="32" color="#334155"/>
  <text class="box-title" x="502" y="202">Migration job</text>
  <text class="box-text" x="502" y="226">runs SQL migrations</text>

  <rect class="external" x="1600" y="120" width="360" height="135" rx="16"/>
  <rect class="badge-dark" x="1618" y="139" width="52" height="52" rx="12"/>
  <use href="#icon-github" x="1626" y="147" width="36" height="36" color="#fff"/>
  <text class="box-title" x="1684" y="165">GitHub REST API</text>
  <text class="box-sub" x="1684" y="183">api.github.com</text>
  <text class="box-text" x="1684" y="211">repo validation</text>
  <text class="box-text" x="1684" y="233">latest release lookup</text>

  <rect class="main-boundary" x="40" y="315" width="1210" height="628" rx="26"/>
  <text class="section-title" x="72" y="353" fill="#6d28d9">MAIN APP - github-release-notifier</text>
  <text class="tiny" x="72" y="375">Express API - modules - saga orchestration - scanner</text>

  <text class="lane-label" x="72" y="405">ENTRY &amp; CROSS-CUTTING</text>
  <rect class="module" x="70" y="417" width="360" height="100" rx="14"/>
  <text class="box-title" x="86" y="451">Express HTTP API</text>
  <text class="box-text" x="86" y="479">/api subscribe, confirm, unsubscribe</text>
  <text class="box-text" x="86" y="499">/docs, static UI, health</text>

  <rect class="module" x="460" y="417" width="360" height="100" rx="14"/>
  <text class="box-title" x="476" y="451">Observability module</text>
  <text class="box-text" x="476" y="479">structured logs</text>
  <text class="box-text" x="476" y="499">/metrics for Prometheus</text>

  <rect class="module" x="850" y="417" width="360" height="100" rx="14"/>
  <text class="box-title" x="866" y="451">Health module</text>
  <text class="box-text" x="866" y="479">/health, /health/live</text>
  <text class="box-text" x="866" y="499">/health/ready checks DB</text>

  <text class="lane-label" x="72" y="541">CONFIRMATION FLOW</text>
  <rect class="module" x="70" y="551" width="360" height="126" rx="14"/>
  <text class="box-title" x="86" y="585">Subscriptions module</text>
  <text class="box-text" x="86" y="613">create / confirm / unsubscribe</text>
  <text class="box-text" x="86" y="633">validate input and tokens</text>
  <text class="box-text" x="86" y="653">starts confirmation saga</text>

  <rect class="module" x="460" y="551" width="360" height="126" rx="14"/>
  <text class="box-title" x="476" y="585">Sagas module</text>
  <text class="box-text" x="476" y="613">subscription-confirmation saga</text>
  <text class="box-text" x="476" y="633">STARTED -> PENDING -> COMPLETED</text>
  <text class="box-text" x="476" y="653">compensation + timeout recovery</text>

  <rect class="module" x="850" y="551" width="360" height="126" rx="14"/>
  <text class="box-title" x="866" y="585">Notifications client</text>
  <text class="box-text" x="866" y="613">gRPC confirmation call</text>
  <text class="box-text" x="866" y="633">RabbitMQ publisher</text>
  <text class="box-text" x="866" y="653">used by saga and scanner</text>

  <text class="lane-label" x="72" y="767">SCAN &amp; MESSAGING</text>
  <rect class="module" x="70" y="777" width="360" height="126" rx="14"/>
  <text class="box-title" x="86" y="811">Release tracking module</text>
  <text class="box-text" x="86" y="839">periodic release scanner</text>
  <text class="box-text" x="86" y="859">GitHub client</text>
  <text class="box-text" x="86" y="879">per-repository failure isolation</text>

  <rect class="module" x="460" y="777" width="360" height="126" rx="14"/>
  <text class="box-title" x="476" y="811">Messaging module</text>
  <text class="box-text" x="476" y="839">RabbitMQ topology</text>
  <text class="box-text" x="476" y="859">retry queues + DLQ</text>
  <text class="box-text" x="476" y="879">saga reply queue</text>

  <rect class="module" x="850" y="777" width="360" height="126" rx="14"/>
  <text class="box-title" x="866" y="811">Architecture checks</text>
  <text class="box-text" x="866" y="839">module public APIs</text>
  <text class="box-text" x="866" y="859">layer dependency tests</text>

  <rect class="service-boundary" x="1350" y="315" width="610" height="500" rx="26"/>
  <text class="section-title" x="1380" y="353" fill="#0e7490">MICROSERVICE - notification-service</text>
  <text class="tiny" x="1380" y="375">Email delivery over REST, gRPC and RabbitMQ</text>

  <rect class="service" x="1380" y="470" width="265" height="100" rx="14"/>
  <text class="box-title" x="1398" y="504">REST API</text>
  <text class="box-text" x="1398" y="530">HTTP :3002</text>
  <text class="box-text" x="1398" y="550">/api/notifications/*</text>

  <rect class="service" x="1675" y="470" width="265" height="100" rx="14"/>
  <text class="box-title" x="1693" y="504">gRPC server</text>
  <text class="box-text" x="1693" y="530">HTTP/2 :3003</text>
  <text class="box-text" x="1693" y="550">NotificationService</text>

  <rect class="service" x="1380" y="615" width="265" height="140" rx="14"/>
  <text class="box-title" x="1398" y="649">RabbitMQ consumer</text>
  <text class="box-text" x="1398" y="677">confirmation commands</text>
  <text class="box-text" x="1398" y="697">release commands</text>
  <text class="box-text" x="1398" y="717">retry / DLQ on failure</text>

  <rect class="service" x="1675" y="615" width="265" height="140" rx="14"/>
  <text class="box-title" x="1693" y="649">Email service</text>
  <text class="box-text" x="1693" y="677">SMTP transport</text>
  <text class="box-text" x="1693" y="697">confirmation templates</text>
  <text class="box-text" x="1693" y="717">release templates</text>

  <text class="tiny" x="1380" y="792">Uses PostgreSQL for processed message idempotency</text>

  <rect class="external" x="1600" y="865" width="360" height="110" rx="16"/>
  <rect class="badge-slate" x="1616" y="879" width="46" height="46" rx="10"/>
  <use href="#icon-mail" x="1623" y="886" width="32" height="32" color="#334155"/>
  <text class="box-title" x="1674" y="903">SMTP / MailHog</text>
  <text class="box-text" x="1674" y="927">confirmation emails</text>
  <text class="box-text" x="1674" y="949">release emails</text>

  <rect class="db" x="40" y="1015" width="590" height="190" rx="18"/>
  <rect class="badge-blue" x="58" y="1033" width="48" height="48" rx="11"/>
  <use href="#icon-db" x="66" y="1041" width="32" height="32" color="#2563eb"/>
  <text class="section-title" x="122" y="1055" fill="#1d4ed8">PostgreSQL</text>
  <text class="box-sub" x="122" y="1073">primary datastore</text>
  <text class="box-text" x="58" y="1105">repositories, subscriptions, releases</text>
  <text class="box-text" x="58" y="1127">sagas, processed saga replies</text>
  <text class="box-text" x="58" y="1149">processed messages</text>
  <text class="box-text" x="58" y="1171">unique tokens and constraints</text>

  <rect class="mq" x="660" y="1015" width="590" height="190" rx="18"/>
  <rect class="badge-orange" x="678" y="1033" width="48" height="48" rx="11"/>
  <use href="#icon-broker" x="686" y="1041" width="32" height="32" color="#ea580c"/>
  <text class="section-title" x="742" y="1055" fill="#c2410c">RabbitMQ</text>
  <text class="box-sub" x="742" y="1073">async broker</text>
  <text class="box-text" x="678" y="1105">notification command queue</text>
  <text class="box-text" x="678" y="1127">retry queue + dead-letter queue</text>
  <text class="box-text" x="678" y="1149">saga reply queue</text>
  <text class="box-text" x="678" y="1171">durable messages</text>

  <rect class="obs" x="1350" y="1015" width="610" height="190" rx="18"/>
  <rect class="badge-gray" x="1368" y="1033" width="48" height="48" rx="11"/>
  <use href="#icon-flame" x="1376" y="1041" width="32" height="32" color="#64748b"/>
  <text class="section-title" x="1432" y="1055" fill="#64748b">OBSERVABILITY STACK</text>
  <text class="box-sub" x="1432" y="1073">peripheral / cross-cutting</text>
  <text class="box-text" x="1368" y="1105">Prometheus scrapes /metrics</text>
  <text class="box-text" x="1368" y="1127">Grafana dashboards</text>
  <text class="box-text" x="1368" y="1149">GELF logs -> Logstash -> Elasticsearch -> Kibana</text>

  <path class="flow purple" d="M370 200 L400 200 L400 417"/>
  <text class="tiny" x="408" y="380" fill="#7c3aed">REST /api</text>

  <path class="flow purple" d="M250 517 L250 551"/>
  <path class="flow purple" d="M430 614 L460 614"/>
  <path class="flow purple" d="M820 614 L850 614"/>
  <path class="flow purple" d="M1210 614 L1288 614 L1288 440 L1807 440 L1807 470"/>
  <text class="tiny" x="1430" y="430" fill="#7c3aed">gRPC confirmation</text>

  <path class="flow green" d="M250 677 L250 777"/>
  <text class="tiny" x="258" y="735" fill="#15803d">repo check</text>
  <path class="flow green" d="M390 777 L390 740 L1270 740 L1270 188 L1600 188"/>
  <text class="tiny" x="895" y="734" fill="#15803d">validate repo + latest release</text>

  <path class="flow orange" d="M410 777 L410 705 L870 705 L870 677"/>
  <text class="tiny" x="425" y="699" fill="#ea580c">new release</text>
  <path class="flow orange" d="M1000 677 L1000 725 L640 725 L640 777"/>
  <text class="tiny" x="890" y="718" fill="#ea580c">publish command</text>
  <path class="flow orange" d="M640 903 L640 983 L750 983 L750 1015"/>
  <text class="tiny" x="660" y="978" fill="#ea580c">AMQP publish</text>
  <path class="flow orange" d="M1150 1015 L1150 1002 L1310 1002 L1310 685 L1380 685"/>
  <text class="tiny" x="1155" y="996" fill="#ea580c">consume command</text>

  <path class="flow teal" d="M1512 570 L1512 615"/>
  <path class="flow teal" d="M1645 685 L1675 685"/>
  <path class="flow teal" d="M1807 755 L1807 865"/>
  <text class="tiny" x="1816" y="815" fill="#0891b2">SMTP</text>

  <path class="flow-dashed gray" d="M585 244 L585 290 L20 290 L20 955 L100 955 L100 1015"/>
  <text class="tiny" x="485" y="284" fill="#64748b">SQL migrations</text>
  <path class="flow-dashed gray" d="M250 903 L250 1015"/>
  <path class="flow-dashed gray" d="M580 677 L580 972 L410 972 L410 1015"/>
  <path class="flow-dashed gray" d="M1512 755 L1512 982 L335 982 L335 1015"/>
