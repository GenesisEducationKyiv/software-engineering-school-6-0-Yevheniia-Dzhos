services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: releases_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d releases_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "11025:1025"
      - "18025:8025"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "55672:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  rabbitmq_test_data:
  
