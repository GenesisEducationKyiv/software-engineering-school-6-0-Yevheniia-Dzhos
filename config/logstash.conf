input {
  gelf {
    port => 12201
  }
}

filter {
  if [message] =~ /^\{/ {
    json {
      source => "message"
      tag_on_failure => ["_json_parse_failure"]
    }
  } else if [short_message] =~ /^\{/ {
    json {
      source => "short_message"
      tag_on_failure => ["_json_parse_failure"]
    }
  }

  if [service] {
    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
      }
      mutate {
        remove_field => ["timestamp"]
      }
    }

    mutate {
      rename => {
        "level"   => "log.level"
        "service" => "service.name"
      }
      remove_field => ["short_message"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "github-release-notifier-logs-%{+YYYY.MM.dd}"
  }
}